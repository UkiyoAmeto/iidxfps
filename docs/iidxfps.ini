; ============================================================================
;  iidxfps.ini  -  beatmania IIDX 高精度帧计时 / Monitor Check 修正模块配置
;  v1.0.0
; ============================================================================
;  这个文件必须和 iidxfps.dll 放在同一个目录（也就是游戏的 contents 目录）。
;  修改后需要重启游戏才会生效。
;
;  运行后会在同一个目录生成 iidxfps_report.txt，里面是本次运行的完整状态
;  （配置、机台判定、桌面刷新率、限速点、实测帧率、最近日志）。
;  要反馈问题的话，直接把这一个文件发出来就够了。
; ============================================================================

[General]

; 总开关。0 = 整个模块不工作（等同于没有加载它）。
Enabled=1

; 目标帧率，也就是我们希望游戏每秒推进多少个逻辑帧。
;   auto = 自动判断机台：
;            TDJ（120Hz 机台）  -> 120
;            LDJ（60Hz  机台）  -> 60
;          判断方式和 spice2x 自己一样：C:\000rom.txt 内容为 TDJ-JA，
;          或 D:\001rom.txt 内容为 TDJ，或 AVS model 名为 TDJ。
;   60 / 120 / 其它数字 = 强制指定。
;
; 注意：如果你的游戏是 LDJ 的 bm2dx.dll，但打了
;      "Force LDJ Custom Timing/Adapter FPS" + "Choose ... FPS = 120"
;      这类补丁（也就是 LDJ 跑 120 帧计时），请在这里写 FPS=120，
;      否则模块会按 60 帧去限制，游戏会变成半速。
FPS=auto

; 限速点（在哪里把游戏主循环按住）：
;   auto      = 自动选择有响应的那一个，优先级：
;                draw（spice2x 绘制回调，一个游戏帧一次）>
;                swapchain（IDirect3DSwapChain9::Present）>
;                present（IDirect3DDevice9(Ex)::Present / PresentEx）
;               实测本游戏请用 auto：bm2dx.dll 一帧会 Present 两个交换链
;               （主画面 + 副画面），所以"按 Present 限速"会一帧等两次、
;               游戏变成半速；而 spice 的绘制回调一帧只触发一次。
;   draw        = 强制用绘制回调（本游戏实测最准）
;   swapchain   = 强制用交换链 Present（只会给第一个交换链实例限速）
;   present     = 强制用设备 Present / PresentEx
; 报告文件里的 pacing / pacePoint= 会告诉你实际用上了哪一个。
PaceAt=auto

; 强制把交换链改成无垂直同步（D3DPRESENT_INTERVAL_IMMEDIATE）。
; 必须为 1，否则在刷新率高于目标帧率的显示器上无法把帧率压到 120/60，
; 因为 Present 会被 vsync 卡在显示器刷新率上。代价是可能出现画面撕裂。
; 只有在排查问题时才临时改成 0。
ForceImmediatePresent=1

; 桌面刷新率和目标帧率本来就一致时（误差 3% 以内），干脆什么都不做：
; 不开无 vsync、不限速，保持原本干净的画面（那种机器上游戏速度本来就是对的）。
; 1 = 推荐；0 = 不管刷新率，一律用高精度计时器限速。
SkipWhenRefreshMatches=1

; 上面那条的例外开关：就算刷新率和目标一致也强行限速。
; 什么时候需要它：显示器报 60Hz、但游戏因为窗口化/DWM/驱动的关系实际跑在
; 125fps 之类的地方。报告文件里如果没有 "WARNING: the game runs at ..."，
; 说明不需要开。
ForcePacing=0

; 欺骗显示器刷新率上报：把 bm2dx.dll 看到的 dmDisplayFrequency 改成目标帧率。
; 游戏的计时 / Monitor Check 会读取这个值来判断“适配器帧率”。
SpoofDisplayRefresh=1

; 上面那个欺骗是否连“枚举出来的所有显示模式”也一起改。
; 1 = 游戏会认为这块显示器在任何分辨率下都支持目标帧率（推荐）。
; 0 = 只改“当前显示模式”那一次查询。
SpoofAllModes=1

; 用 QueryPerformanceCounter 重新实现 bm2dx.dll 里的 timeGetTime / GetTickCount。
; 单位完全一样（毫秒，同样的 32 位回绕行为），只是分辨率从原本的 1ms
; 变成高精度计时器的分辨率，不再受系统调度抖动影响。
HighPrecisionTime=1

; 每秒往 spice 日志里写一行实测帧率，并刷新 iidxfps_report.txt。
; 0 = 不写（报告文件也不会更新）。
LogFrameRate=1

; 诊断模式：1 = 不装任何钩子、不改任何东西，只统计游戏“原本”的帧率。
; 想确认显示器多少 Hz、游戏原本跑多少帧时，把它设成 1 启动一次，
; 然后看报告文件里的 frames/s 一行。
; 本机实测：120Hz 桌面上，本游戏原本跑 draw≈125（60 帧机台 → 两倍速）。
MeasureOnly=0

; 是否挂钩 IDirect3DDevice9::Present（默认即可）。
HookPresent=1

; 是否也挂钩 IDirect3DDevice9Ex::PresentEx。
; 默认 1：实测真正的 bm2dx.dll 走的是 PresentEx。
; 如果报告里出现 "WARNING: pacing ran more than once per frame"（半速），
; 说明游戏同一帧同时走了 Present 和 PresentEx，把它改成 0。
HookPresentEx=1

; ============================================================================
;  运行中的快捷键（游戏窗口在前台时按住 Ctrl+Shift）
;    Ctrl+Shift+F9  : 在 120 / 60 帧之间切换目标帧率（会立刻改变游戏速度！）
;    Ctrl+Shift+F10 : 开关显示器刷新率欺骗
;    Ctrl+Shift+F11 : 往 spice 日志里写一行当前状态
; ============================================================================
